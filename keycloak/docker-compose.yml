version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: sgff-keycloak
    command: start-dev
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      # Use embedded H2 database for dev (replace with Postgres for prod)
      KC_DB: dev-file

      # Hostname (accessible from browser and Laravel)
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"

    ports:
      - "8080:8080"

    volumes:
      - keycloak_sgff_data:/opt/keycloak/data

    restart: unless-stopped

volumes:
  keycloak_sgff_data:
